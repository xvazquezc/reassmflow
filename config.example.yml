# Example parameter file. Replace all paths and sample IDs for your project.
# input_csv must contain the columns: id,path
input_csv: samples.csv

# Libraries can be defined once globally and selected by a sample's `libraries`
# list under raw_libraries.
global_libraries:
  shared_long_reads:
    long_reads:
      - "/srv/scratch/burnslab/Seqdata/master_ont.fastq.gz"
  shared_short_reads:
    short_reads:
      - r1: "/srv/scratch/burnslab/xabi/sr-binning/reads/new-all_trimmed_reads_R1.fastq.gz"
        r2: "/srv/scratch/burnslab/xabi/sr-binning/reads/new-all_trimmed_reads_R2.fastq.gz"
        singletons: "/srv/scratch/burnslab/xabi/sr-binning/reads/new-all_trimmed_reads_singles.fastq.gz"

raw_libraries:
  sample_01:
    libraries:
      - shared_long_reads
      - shared_short_reads

# Existing shared Conda environment directories, used by the Katana config.
conda_envs:
  mapping: "/shared/conda/envs/reassmflow-mapping"
  lr_assm: "/shared/conda/envs/reassmflow-lr"
  sr_assm: "/shared/conda/envs/reassmflow-sr"

outdir: results
